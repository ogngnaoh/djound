server.address=127.0.0.1
server.port=${DJOUND_PORT:8080}
spring.datasource.url=${DJOUND_DB_URL:jdbc:postgresql://127.0.0.1:55432/djound}
spring.datasource.username=${DJOUND_DB_USER:djound}
spring.datasource.password=${DJOUND_DB_PASSWORD:djound}
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
djound.data-dir=${DJOUND_DATA_DIR:.runtime/data}
djound.ffprobe=${DJOUND_FFPROBE:ffprobe}
djound.allowed-origins=${DJOUND_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
djound.mode=${DJOUND_MODE:UNCONFIGURED}
djound.fixture-delay-ms=${DJOUND_FIXTURE_DELAY_MS:2000}
