name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: App, contracts, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJOUND_MODE: UNCONFIGURED
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install media and browser dependencies
        run: |
          # Avoid the slow regional Azure mirror on hosted runners.
          sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' \) -exec \
            sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Prepare build dependencies and PostgreSQL
        run: |
          source scripts/env.sh
          server/mvnw -B -f server/pom.xml -DskipTests dependency:go-offline
          docker compose pull db

      # Exercises real PostgreSQL/files and fixture audio, never model inference.
      # Apple Silicon model qualification remains an explicit local check.
      - name: Verify the application
        run: bash scripts/verify.sh

      - name: Check generated API types are committed
        run: git diff --exit-code -- web/src/api-schema.d.ts

      - name: Retain test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            server/target/surefire-reports/

      - name: Stop the disposable CI database
        if: always()
        run: docker compose down
