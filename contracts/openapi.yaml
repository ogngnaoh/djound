openapi: 3.1.0
info:
  title: Djound local application API
  version: 0.1.0
  description: Local single-person audio workspace with explicit sample mode and an opt-in anonymous MelodyFlow adapter for short clips. Live submissions require a separately provisioned bounded allowance.
servers:
  - url: /
paths:
  /api/workspace:
    get:
      operationId: getWorkspace
      responses:
        '200':
          description: Installation and local input policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
  /api/workspace/availability/recheck:
    post:
      operationId: recheckAvailability
      description: Explicit bounded non-generating observation. Unsupported checks never clear a current block; no request is submitted.
      responses:
        '200':
          description: Current workspace after the observation or unsupported-check policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations:
    get:
      operationId: listExplorations
      responses:
        '200':
          description: Library, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExplorationSummary' }
    post:
      operationId: createExploration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, initialDraft]
              properties:
                file: { type: string, format: binary }
                initialDraft: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Accepted upload, or identical accepted receipt replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getExploration
      responses:
        '200':
          description: Current durable exploration state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exploration' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdate' }
      responses:
        '200':
          description: Saved draft and its advanced revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/source:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: replaceSource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expectedSourceRevision]
              properties:
                file: { type: string, format: binary }
                expectedSourceRevision: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Accepted replacement or identical receipt replay; fetch current draft after replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: createRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequestCommand' }
      responses:
        '202':
          description: Durable acceptance or identical receipt replay; fetch current attempt and draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/attempts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getAttempt
      responses:
        '200':
          description: Durable attempt phase, immutable request, and any published result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/requests/{id}/retries:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: retryRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryCommand' }
      responses:
        '202':
          description: New attempt of the same immutable request, or receipt replay; never consumes a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls:
    get:
      operationId: getFixtureControls
      responses:
        '200':
          description: Local sample review controls, only when explicitly enabled in FIXTURE mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/next-attempt:
    put:
      operationId: setFixtureOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixtureOutcomeControl' }
      responses:
        '200':
          description: One-shot outcome for the next deliberately accepted attempt; no request is submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/playback:
    put:
      operationId: setFixturePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixturePlaybackControl' }
      responses:
        '200':
          description: Toggle a non-destructive playback failure for one stored fixture rendition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/availability:
    put:
      operationId: setFixtureAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixtureAvailabilityControl' }
      responses:
        '200':
          description: Explicit sample availability scenario; only in enabled fixture review mode, with no generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      operationId: updateRecording
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingUpdate' }
      responses:
        '200':
          description: Rendition with the explicitly requested kept state; never generates audio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        default: { $ref: '#/components/responses/Problem' }
  /api/media/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getMedia
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Exact stored audio bytes
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '206':
          description: Requested audio byte range
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '416': { description: Requested range is unsatisfiable }
        default: { $ref: '#/components/responses/Problem' }
    head:
      operationId: headMedia
      responses:
        '200': { description: Audio metadata headers without a body }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
  responses:
    Problem:
      description: Typed recoverable application error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, permittedActions]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        permittedActions:
          type: array
          items: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    InputPolicy:
      type: object
      required: [formats, maxBytes, minDurationMs, maxDurationMs, sampleRates, channels, maxTextCodePoints, maxAssembledCodePoints, providerMaxDurationMs, providerCompatibilityKnown]
      properties:
        formats:
          type: array
          items: { type: string, enum: [WAV_PCM16, MP3] }
        maxBytes: { type: integer, format: int64 }
        minDurationMs: { type: integer }
        maxDurationMs: { type: integer }
        sampleRates:
          type: array
          items: { type: integer }
        channels:
          type: array
          items: { type: integer }
        maxTextCodePoints: { type: integer }
        maxAssembledCodePoints:
          type: integer
          description: Limit on literal assembled instructions, including inherited context. Saved drafts are never truncated to fit it.
        providerMaxDurationMs:
          type: [integer, 'null']
          description: Concrete provider source/output duration ceiling, enforced using precise or conservative duration evidence rather than rounded display metadata.
        providerCompatibilityKnown: { type: boolean }
    Workspace:
      type: object
      required: [mode, configuration, eligibility, reasonCode, observedAt, providerResetAt, nextProbeAt, supportsStatusCheck, canRecheck, canSubmit, canSubmitWithAcknowledgement, canCreateExploration, activeAttemptId, unknownOutcome, submissionAllowance, fixtureControlsEnabled, inputPolicy]
      properties:
        mode: { type: string, enum: [UNCONFIGURED, FIXTURE, LIVE] }
        configuration: { type: string, enum: [UNCONFIGURED, CONFIGURED] }
        eligibility: { type: string, enum: [ELIGIBLE, BLOCKED, UNKNOWN] }
        reasonCode: { type: [string, 'null'] }
        observedAt: { type: [string, 'null'], format: date-time }
        providerResetAt:
          type: [string, 'null']
          format: date-time
          description: Provider-reported reset only when reliable; never inferred from local backoff.
        nextProbeAt:
          type: [string, 'null']
          format: date-time
          description: Local retry or availability-check cooldown boundary, not a quota reset.
        supportsStatusCheck: { type: boolean }
        canRecheck: { type: boolean }
        canSubmit: { type: boolean }
        canSubmitWithAcknowledgement:
          type: boolean
          description: True only when acknowledgement of the unresolved outcome is the sole remaining submission blocker.
        canCreateExploration: { type: boolean }
        activeAttemptId: { type: [string, 'null'] }
        unknownOutcome:
          oneOf:
            - $ref: '#/components/schemas/UnknownOutcome'
            - type: 'null'
        submissionAllowance:
          oneOf:
            - $ref: '#/components/schemas/SubmissionAllowance'
            - type: 'null'
        fixtureControlsEnabled: { type: boolean }
        inputPolicy: { $ref: '#/components/schemas/InputPolicy' }
    UnknownOutcome:
      type: object
      required: [attemptId, detail, occurredAt, provenance]
      properties:
        attemptId: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
        provenance: { type: string, enum: [FIXTURE, LIVE] }
    SubmissionAllowance:
      type: object
      description: Installation-bound authorization for live submissions, separate from unknown provider quota. Reservation consumes a slot before transmission, with no refund or application replenishment.
      required: [limit, used, remaining, provisioned]
      properties:
        limit: { type: integer, minimum: 0, maximum: 2 }
        used: { type: integer, minimum: 0, maximum: 2 }
        remaining: { type: integer, minimum: 0, maximum: 2 }
        provisioned: { type: boolean }
    Recording:
      type: object
      required: [id, explorationId, kind, title, fileName, contentType, byteSize, durationMs, sampleRate, channels, codec, sha256, mediaUrl, provenance, kept, direction, requestId, attemptId, createdAt]
      properties:
        id: { type: string }
        explorationId: { type: string }
        kind: { type: string, enum: [ORIGINAL, RENDITION] }
        title: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        durationMs: { type: integer }
        sampleRate: { type: integer }
        channels: { type: integer }
        codec: { type: string }
        sha256: { type: string }
        mediaUrl: { type: string }
        provenance: { type: string, enum: [ORIGINAL, FIXTURE, LIVE] }
        kept: { type: boolean }
        direction: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        attemptId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Draft:
      type: object
      required: [text, basisRecordingId, revision]
      properties:
        text: { type: string }
        basisRecordingId: { type: [string, 'null'] }
        revision: { type: integer, format: int64 }
    DraftUpdate:
      type: object
      required: [text, basisRecordingId, expectedDraftRevision]
      properties:
        text: { type: string, maxLength: 4000 }
        basisRecordingId: { type: [string, 'null'] }
        expectedDraftRevision: { type: integer, format: int64, minimum: 1 }
    Exploration:
      type: object
      required: [id, title, sourceRevision, original, renditions, draft, canReplaceSource, latestAttempt, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        sourceRevision: { type: integer, format: int64 }
        original: { $ref: '#/components/schemas/Recording' }
        renditions:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        draft: { $ref: '#/components/schemas/Draft' }
        canReplaceSource: { type: boolean }
        latestAttempt:
          oneOf:
            - $ref: '#/components/schemas/Attempt'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExplorationSummary:
      type: object
      required: [id, title, original, renditionCount, keptRecordings, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        original: { $ref: '#/components/schemas/Recording' }
        renditionCount: { type: integer }
        keptRecordings:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        updatedAt: { type: string, format: date-time }
    UploadReceipt:
      type: object
      required: [explorationId, originalRecordingId, sourceRevision, draftRevision, location, replayed]
      properties:
        explorationId: { type: string }
        originalRecordingId: { type: string }
        sourceRevision: { type: integer, format: int64 }
        draftRevision: { type: integer, format: int64 }
        location: { type: string }
        replayed: { type: boolean }
    CreateRequestCommand:
      type: object
      required: [text, basisRecordingId, expectedSourceRevision, expectedDraftRevision]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        basisRecordingId: { type: [string, 'null'] }
        expectedSourceRevision: { type: integer, format: int64, minimum: 1 }
        expectedDraftRevision: { type: integer, format: int64, minimum: 1 }
        acknowledgedUnknownAttemptId:
          type: string
          minLength: 1
          description: Explicit acknowledgement captured with this deliberate command. Retired only if the new command is accepted; omitted legacy commands retain their fingerprint encoding.
    CreationReceipt:
      type: object
      required: [requestId, attemptId, statusUrl, consumedDraftRevision, nextDraftRevision, replayed]
      properties:
        requestId: { type: string }
        attemptId: { type: string }
        statusUrl: { type: string }
        consumedDraftRevision: { type: integer, format: int64 }
        nextDraftRevision: { type: integer, format: int64 }
        replayed: { type: boolean }
    GenerationRequest:
      type: object
      required: [id, explorationId, sourceRecordingId, sourceRevision, basisRecordingId, text, inheritedDirection, direction, assembledInstructions, assemblerVersion, adapterConfigurationId, provenance, createdAt]
      properties:
        id: { type: string }
        explorationId: { type: string }
        sourceRecordingId: { type: string }
        sourceRevision: { type: integer, format: int64 }
        basisRecordingId: { type: [string, 'null'] }
        text: { type: string }
        inheritedDirection: { type: string }
        direction: { type: string }
        assembledInstructions: { type: string }
        assemblerVersion: { type: string }
        adapterConfigurationId: { type: string }
        provenance: { type: string, enum: [FIXTURE, LIVE] }
        createdAt: { type: string, format: date-time }
    Attempt:
      type: object
      required: [id, explorationId, requestId, state, version, request, outcome, resultRecordingId, previousAttemptId, canRetry, permittedActions, createdAt, updatedAt]
      properties:
        id: { type: string }
        explorationId: { type: string }
        requestId: { type: string }
        state: { type: string, enum: [ACCEPTED, SUBMITTING, RUNNING, SAVING, RECONCILING, SUCCEEDED, FAILED] }
        version: { type: integer, format: int64 }
        request: { $ref: '#/components/schemas/GenerationRequest' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/AttemptOutcome'
            - type: 'null'
        resultRecordingId: { type: [string, 'null'] }
        previousAttemptId: { type: [string, 'null'] }
        canRetry: { type: boolean }
        permittedActions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttemptOutcome:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
    RecordingUpdate:
      type: object
      required: [kept]
      properties:
        kept: { type: boolean }
    RetryCommand:
      type: object
      required: [expectedPreviousAttemptId]
      properties:
        expectedPreviousAttemptId: { type: string, minLength: 1 }
        acknowledgedUnknownAttemptId:
          type: string
          minLength: 1
          description: Explicit acknowledgement captured with this deliberate retry. Never added or changed during receipt replay.
    RetryReceipt:
      type: object
      required: [requestId, attemptId, statusUrl, replayed]
      properties:
        requestId: { type: string }
        attemptId: { type: string }
        statusUrl: { type: string }
        replayed: { type: boolean }
    FixtureControls:
      type: object
      required: [nextOutcome, unavailableRecordingId]
      properties:
        nextOutcome: { type: string, enum: [SUCCESS, FAILURE, UNKNOWN, CAPACITY_UNAVAILABLE] }
        unavailableRecordingId: { type: [string, 'null'] }
    FixtureOutcomeControl:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [SUCCESS, FAILURE, UNKNOWN, CAPACITY_UNAVAILABLE] }
    FixtureAvailabilityControl:
      type: object
      required: [scenario]
      properties:
        scenario:
          type: string
          enum: [READY, BLOCKED_NO_STATUS, STATUS_SUCCESS, STATUS_MALFORMED, STATUS_TIMEOUT]
    FixturePlaybackControl:
      type: object
      required: [recordingId, unavailable]
      properties:
        recordingId: { type: string, minLength: 1 }
        unavailable: { type: boolean }
