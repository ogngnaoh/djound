openapi: 3.1.0
info:
  title: Djound local application API
  version: 0.1.0
  description: Local audio workspace for recording uploads, reviewed arrangements, stem mixing and versioned playback. Local inference uses Basic Pitch and optional Qwen. Historical recordings retain their original provenance.
servers:
  - url: /
paths:
  /api/explorations/{id}/local/manual-plans:
    post:
      operationId: createManualLocalPlan
      description: Copies the selected basis arrangement into an immutable reviewable plan without calling a language model. Text is retained as user context, not interpreted. Corrections and explicit creation remain separate actions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalPlanCommand' }
      responses:
        '201':
          description: Direct arrangement plan ready for user review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalPlan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/local/plans/{id}/corrections:
    post:
      operationId: correctLocalPlan
      description: Creates an immutable user-edited plan without invoking the language model. Preserves the original model suggestion and requires the same current source, confirmed notes, draft, text and basis.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalCorrectionCommand' }
      responses:
        '201':
          description: A new user-corrected plan, still requiring explicit Create confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalPlan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/local:
    get:
      operationId: getLocalMusic
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Durable local notes, preparation state and current proposed changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/local/transcriptions:
    post:
      operationId: transcribeLocal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalSourceCommand' }
      responses:
        '202':
          description: Saved local operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalJob' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/local/notes:
    put:
      operationId: saveLocalNotes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalNotesCommand' }
      responses:
        '200':
          description: Saved local operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalNotes' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/local/previews:
    post:
      operationId: previewLocalNotes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalRevisionCommand' }
      responses:
        '202':
          description: Saved local operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalJob' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/local/plans:
    post:
      operationId: proposeLocalPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalPlanCommand' }
      responses:
        '202':
          description: Saved local operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalJob' }
        default: { $ref: '#/components/responses/Problem' }
  /api/local/jobs/{id}:
    get:
      operationId: getLocalJobResult
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status of the named job and its own immutable plan, when available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalJobResult' }
        default: { $ref: '#/components/responses/Problem' }
  /api/local/jobs/{id}/cancel:
    post:
      operationId: cancelLocalPreparation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelled or already terminal operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalJob' }
        default: { $ref: '#/components/responses/Problem' }
  /api/attempts/{id}/cancel:
    post:
      operationId: cancelLocalCreation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelled or already terminal operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/local/jobs/{id}/audio:
    get:
      operationId: getLocalPreview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Immutable validated note preview
          content:
            audio/wav:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/workspace:
    get:
      operationId: getWorkspace
      responses:
        '200':
          description: Installation and local input policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
  /api/workspace/availability/recheck:
    post:
      operationId: recheckAvailability
      description: Explicit bounded non-generating observation. Unsupported checks never clear a current block; no request is submitted.
      responses:
        '200':
          description: Current workspace after the observation or unsupported-check policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations:
    get:
      operationId: listExplorations
      responses:
        '200':
          description: Library, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExplorationSummary' }
    post:
      operationId: createExploration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, initialDraft]
              properties:
                file: { type: string, format: binary }
                initialDraft: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Accepted upload, or identical accepted receipt replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getExploration
      responses:
        '200':
          description: Current durable exploration state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exploration' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdate' }
      responses:
        '200':
          description: Saved draft and its advanced revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/source:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: replaceSource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expectedSourceRevision]
              properties:
                file: { type: string, format: binary }
                expectedSourceRevision: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Accepted replacement or identical receipt replay; fetch current draft after replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/explorations/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: createRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequestCommand' }
      responses:
        '202':
          description: Durable acceptance or identical receipt replay; fetch current attempt and draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/attempts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getAttempt
      responses:
        '200':
          description: Durable attempt phase, immutable request, and any published result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/requests/{id}/retries:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: retryRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryCommand' }
      responses:
        '202':
          description: New attempt of the same immutable request, or receipt replay; never consumes a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls:
    get:
      operationId: getFixtureControls
      responses:
        '200':
          description: Local sample review controls, only when explicitly enabled in FIXTURE mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/next-attempt:
    put:
      operationId: setFixtureOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixtureOutcomeControl' }
      responses:
        '200':
          description: One-shot outcome for the next deliberately accepted attempt; no request is submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/playback:
    put:
      operationId: setFixturePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixturePlaybackControl' }
      responses:
        '200':
          description: Toggle a non-destructive playback failure for one stored fixture rendition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureControls' }
        default: { $ref: '#/components/responses/Problem' }
  /api/fixture/controls/availability:
    put:
      operationId: setFixtureAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixtureAvailabilityControl' }
      responses:
        '200':
          description: Explicit sample availability scenario; only in enabled fixture review mode, with no generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      operationId: updateRecording
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingUpdate' }
      responses:
        '200':
          description: Rendition with the explicitly requested kept state; never generates audio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        default: { $ref: '#/components/responses/Problem' }
  /api/media/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getMedia
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Exact stored audio bytes
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '206':
          description: Requested audio byte range
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '416': { description: Requested range is unsatisfiable }
        default: { $ref: '#/components/responses/Problem' }
    head:
      operationId: headMedia
      responses:
        '200': { description: Audio metadata headers without a body }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
  responses:
    Problem:
      description: Typed recoverable application error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, permittedActions]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        permittedActions:
          type: array
          items: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    InputPolicy:
      type: object
      required: [formats, maxBytes, minDurationMs, maxDurationMs, sampleRates, channels, maxTextCodePoints, maxAssembledCodePoints, instructionOverheadCodePoints, providerMaxDurationMs, providerCompatibilityKnown]
      properties:
        formats:
          type: array
          items: { type: string, enum: [WAV_PCM16, MP3] }
        maxBytes: { type: integer, format: int64 }
        minDurationMs: { type: integer }
        maxDurationMs: { type: integer }
        sampleRates:
          type: array
          items: { type: integer }
        channels:
          type: array
          items: { type: integer }
        maxTextCodePoints: { type: integer }
        maxAssembledCodePoints:
          type: integer
          description: Limit on literal assembled instructions, including inherited context. Saved drafts are never truncated to fit it.
        instructionOverheadCodePoints:
          type: integer
          minimum: 0
          description: Fixed literal assembler instruction length. Total assembled length is this overhead plus inherited direction and submitted text, measured in Unicode code points.
        providerMaxDurationMs:
          type: [integer, 'null']
          description: Concrete provider source/output duration ceiling, enforced using precise or conservative duration evidence rather than rounded display metadata.
        providerCompatibilityKnown: { type: boolean }
    Workspace:
      type: object
      required: [mode, configuration, eligibility, reasonCode, observedAt, providerResetAt, nextProbeAt, supportsStatusCheck, canRecheck, canSubmit, canSubmitWithAcknowledgement, canCreateExploration, activeAttemptId, activeExplorationId, unknownOutcome, submissionAllowance, fixtureControlsEnabled, inputPolicy]
      properties:
        mode: { type: string, enum: [UNCONFIGURED, FIXTURE, LOCAL] }
        configuration: { type: string, enum: [UNCONFIGURED, CONFIGURED] }
        eligibility: { type: string, enum: [ELIGIBLE, BLOCKED, UNKNOWN] }
        reasonCode: { type: [string, 'null'] }
        observedAt: { type: [string, 'null'], format: date-time }
        providerResetAt:
          type: [string, 'null']
          format: date-time
          description: Provider-reported reset only when reliable; never inferred from local backoff.
        nextProbeAt:
          type: [string, 'null']
          format: date-time
          description: Local retry or availability-check cooldown boundary, not a quota reset.
        supportsStatusCheck: { type: boolean }
        canRecheck: { type: boolean }
        canSubmit: { type: boolean }
        canSubmitWithAcknowledgement:
          type: boolean
          description: True only when acknowledgement of the unresolved outcome is the sole remaining submission blocker. An unresolved historical LIVE attempt is informational for new LOCAL renders.
        canCreateExploration: { type: boolean }
        activeAttemptId: { type: [string, 'null'] }
        activeExplorationId:
          type: [string, 'null']
          description: Exploration owning activeAttemptId; both fields are null when no attempt is active.
        unknownOutcome:
          oneOf:
            - $ref: '#/components/schemas/UnknownOutcome'
            - type: 'null'
        submissionAllowance:
          oneOf:
            - $ref: '#/components/schemas/SubmissionAllowance'
            - type: 'null'
        fixtureControlsEnabled: { type: boolean }
        inputPolicy: { $ref: '#/components/schemas/InputPolicy' }
    UnknownOutcome:
      type: object
      required: [attemptId, detail, occurredAt, provenance]
      properties:
        attemptId: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
        provenance: { type: string, enum: [FIXTURE, LIVE, LOCAL] }
    SubmissionAllowance:
      type: object
      description: Installation-bound authorization for live submissions, separate from unknown provider quota. Limit sums optional legacy authorization and explicit append-only operator grants. Reservation consumes a slot before transmission, with no refund or automatic replenishment.
      required: [limit, used, remaining, provisioned]
      properties:
        limit: { type: integer, format: int64, minimum: 0 }
        used: { type: integer, format: int64, minimum: 0 }
        remaining: { type: integer, format: int64, minimum: 0 }
        provisioned: { type: boolean }
    Recording:
      type: object
      required: [id, explorationId, kind, title, fileName, contentType, byteSize, durationMs, sampleRate, channels, codec, sha256, mediaUrl, provenance, kept, direction, requestId, attemptId, createdAt, localRecipe, localNoteRevision]
      properties:
        id: { type: string }
        explorationId: { type: string }
        kind: { type: string, enum: [ORIGINAL, RENDITION] }
        title: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        durationMs: { type: integer }
        sampleRate: { type: integer }
        channels: { type: integer }
        codec: { type: string }
        sha256: { type: string }
        mediaUrl: { type: string }
        provenance: { type: string, enum: [ORIGINAL, FIXTURE, LIVE, LOCAL] }
        kept: { type: boolean }
        localNoteRevision:
          description: The confirmed melody revision used to render this local version. Null for other recordings.
          type: [integer, "null"]
        localRecipe:
          description: Exact immutable reviewed arrangement used for this LOCAL rendition. Null for originals and recordings without a local plan; never inferred from direction text.
          oneOf:
            - { $ref: '#/components/schemas/LocalRecipe' }
            - { type: 'null' }
        direction: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        attemptId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Draft:
      type: object
      required: [text, basisRecordingId, revision]
      properties:
        text: { type: string }
        basisRecordingId: { type: [string, 'null'] }
        revision: { type: integer, format: int64 }
    DraftUpdate:
      type: object
      required: [text, basisRecordingId, expectedDraftRevision]
      properties:
        text: { type: string, maxLength: 4000 }
        basisRecordingId: { type: [string, 'null'] }
        expectedDraftRevision: { type: integer, format: int64, minimum: 1 }
    Exploration:
      type: object
      required: [id, title, sourceRevision, original, renditions, draft, canReplaceSource, latestAttempt, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        sourceRevision: { type: integer, format: int64 }
        original: { $ref: '#/components/schemas/Recording' }
        renditions:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        draft: { $ref: '#/components/schemas/Draft' }
        canReplaceSource: { type: boolean }
        latestAttempt:
          oneOf:
            - $ref: '#/components/schemas/Attempt'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExplorationSummary:
      type: object
      required: [id, title, original, renditionCount, keptRecordings, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        original: { $ref: '#/components/schemas/Recording' }
        renditionCount: { type: integer }
        keptRecordings:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        updatedAt: { type: string, format: date-time }
    UploadReceipt:
      type: object
      required: [explorationId, originalRecordingId, sourceRevision, draftRevision, location, replayed]
      properties:
        explorationId: { type: string }
        originalRecordingId: { type: string }
        sourceRevision: { type: integer, format: int64 }
        draftRevision: { type: integer, format: int64 }
        location: { type: string }
        replayed: { type: boolean }
    CreateRequestCommand:
      type: object
      required: [text, basisRecordingId, expectedSourceRevision, expectedDraftRevision]
      properties:
        localPlanId: { type: [string, 'null'], description: Required in LOCAL mode; explicitly approves the immutable source/note/draft/basis-bound plan. }
        text: { type: string, minLength: 1, maxLength: 1000 }
        basisRecordingId: { type: [string, 'null'] }
        expectedSourceRevision: { type: integer, format: int64, minimum: 1 }
        expectedDraftRevision: { type: integer, format: int64, minimum: 1 }
        acknowledgedUnknownAttemptId:
          type: string
          minLength: 1
          description: Explicit acknowledgement captured with this deliberate command. A LOCAL creation preserves a historical LIVE unknown outcome even if its ID is echoed. Omitted legacy fields retain their original fingerprint encoding.
    CreationReceipt:
      type: object
      required: [requestId, attemptId, statusUrl, consumedDraftRevision, nextDraftRevision, replayed]
      properties:
        requestId: { type: string }
        attemptId: { type: string }
        statusUrl: { type: string }
        consumedDraftRevision: { type: integer, format: int64 }
        nextDraftRevision: { type: integer, format: int64 }
        replayed: { type: boolean }
    GenerationRequest:
      type: object
      required: [id, explorationId, sourceRecordingId, sourceRevision, basisRecordingId, text, inheritedDirection, direction, assembledInstructions, assemblerVersion, adapterConfigurationId, provenance, createdAt]
      properties:
        id: { type: string }
        explorationId: { type: string }
        sourceRecordingId: { type: string }
        sourceRevision: { type: integer, format: int64 }
        basisRecordingId: { type: [string, 'null'] }
        text: { type: string }
        inheritedDirection: { type: string }
        direction: { type: string }
        assembledInstructions: { type: string }
        assemblerVersion: { type: string }
        adapterConfigurationId: { type: string }
        provenance: { type: string, enum: [FIXTURE, LIVE, LOCAL] }
        createdAt: { type: string, format: date-time }
    Attempt:
      type: object
      required: [id, explorationId, requestId, state, version, request, outcome, resultRecordingId, previousAttemptId, canRetry, permittedActions, createdAt, updatedAt]
      properties:
        id: { type: string }
        explorationId: { type: string }
        requestId: { type: string }
        state: { type: string, enum: [ACCEPTED, SUBMITTING, RUNNING, SAVING, RECONCILING, SUCCEEDED, FAILED] }
        version: { type: integer, format: int64 }
        request: { $ref: '#/components/schemas/GenerationRequest' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/AttemptOutcome'
            - type: 'null'
        resultRecordingId: { type: [string, 'null'] }
        previousAttemptId: { type: [string, 'null'] }
        canRetry: { type: boolean }
        permittedActions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttemptOutcome:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
    RecordingUpdate:
      type: object
      required: [kept]
      properties:
        kept: { type: boolean }
    RetryCommand:
      type: object
      required: [expectedPreviousAttemptId]
      properties:
        expectedPreviousAttemptId: { type: string, minLength: 1 }
        acknowledgedUnknownAttemptId:
          type: string
          minLength: 1
          description: Explicit acknowledgement captured with this deliberate retry. A LOCAL retry preserves a historical LIVE unknown outcome. Receipt replay uses the original command.
    RetryReceipt:
      type: object
      required: [requestId, attemptId, statusUrl, replayed]
      properties:
        requestId: { type: string }
        attemptId: { type: string }
        statusUrl: { type: string }
        replayed: { type: boolean }
    FixtureControls:
      type: object
      required: [nextOutcome, unavailableRecordingId]
      properties:
        nextOutcome: { type: string, enum: [SUCCESS, FAILURE, UNKNOWN, CAPACITY_UNAVAILABLE] }
        unavailableRecordingId: { type: [string, 'null'] }
    FixtureOutcomeControl:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [SUCCESS, FAILURE, UNKNOWN, CAPACITY_UNAVAILABLE] }
    FixtureAvailabilityControl:
      type: object
      required: [scenario]
      properties:
        scenario:
          type: string
          enum: [READY, BLOCKED_NO_STATUS, STATUS_SUCCESS, STATUS_MALFORMED, STATUS_TIMEOUT]
    FixturePlaybackControl:
      type: object
      required: [recordingId, unavailable]
      properties:
        recordingId: { type: string, minLength: 1 }
        unavailable: { type: boolean }

    LocalNote:
      type: object
      additionalProperties: false
      required: [start, end, pitch, velocity]
      properties:
        start: { type: number, minimum: 0, maximum: 12 }
        end: { type: number, exclusiveMinimum: 0, maximum: 12 }
        pitch: { type: integer, minimum: 0, maximum: 127 }
        velocity: { type: integer, minimum: 1, maximum: 127 }
    LocalNotes:
      type: object
      required: [revision, sourceRevision, status, notes, durationSeconds, previewUrl]
      properties:
        revision: { type: integer }
        sourceRevision: { type: integer }
        status: { type: string, enum: [PROPOSED, CONFIRMED] }
        notes: { type: array, items: { $ref: '#/components/schemas/LocalNote' } }
        durationSeconds: { type: number }
        previewUrl: { type: [string, 'null'] }
    LocalJobResult:
      type: object
      required: [job, plan]
      properties:
        job: { $ref: '#/components/schemas/LocalJob' }
        plan: { anyOf: [{ $ref: '#/components/schemas/LocalPlan' }, { type: 'null' }] }
    LocalJob:
      type: object
      required: [id, kind, state, sourceRevision, noteRevision, outcomeCode, detail, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [TRANSCRIBE, PREVIEW, PLAN] }
        state: { type: string, enum: [ACCEPTED, RUNNING, SUCCEEDED, FAILED] }
        sourceRevision: { type: integer }
        noteRevision: { type: [integer, 'null'] }
        outcomeCode: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    LocalMixStrip:
      type: object
      additionalProperties: false
      required: [gainDb, pan, muted]
      properties:
        gainDb: { type: number, minimum: -60, maximum: 12 }
        pan: { type: number, minimum: -1, maximum: 1, description: Left to right. Zero is centered. }
        muted: { type: boolean }
        tone: { type: string, enum: [neutral, warm, bright], description: A bounded two-shelf EQ on this dry track. Neutral or omitted bypasses the EQ. }
    LocalHarmony:
      type: object
      additionalProperties: false
      required: [bpm, downbeatMs, chords]
      description: A reviewed chord chart on its own 4/4 grid. Each bar starting inside the clip has one chord or an explicit rest.
      properties:
        bpm: { type: integer, minimum: 40, maximum: 200 }
        downbeatMs: { type: integer, minimum: 0, maximum: 11990, description: Leave at least 10 ms after the first beat. }
        chords:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: [string, 'null']
            enum: [C, Cm, Db, Dbm, D, Dm, Eb, Ebm, E, Em, F, Fm, 'F#', 'F#m', G, Gm, Ab, Abm, A, Am, Bb, Bbm, B, Bm, null]
    LocalRecipe:
      type: object
      if: { not: { required: [groove] } }
      then: { properties: { bpm: { const: 100 } } }
      additionalProperties: false
      required: [instrument, bass, drums, density, backingVolume, bpm]
      properties:
        instrument: { type: string, enum: [piano, electric_piano, guitar, recorded], description: "Recorded uses the complete uploaded performance as the lead. Confirmed notes guide the added backing." }
        bass: { type: boolean }
        drums: { type: boolean }
        density: { type: string, enum: [sparse, steady] }
        backingVolume: { type: string, enum: [soft, normal] }
        bpm: { type: integer, minimum: 40, maximum: 200, description: "Backing tempo. The original pulse without a groove uses 100 BPM. Lead timing is preserved." }
        groove:
          type: object
          additionalProperties: false
          required: [pattern, downbeatMs]
          properties:
            pattern: { type: string, enum: [swing_ride, four_on_the_floor] }
            downbeatMs: { type: integer, minimum: 0, maximum: 11990, description: "First backing beat in milliseconds. Leave at least 10 ms before the end of the clip." }
        harmony: { $ref: '#/components/schemas/LocalHarmony' }
        mix:
          type: object
          additionalProperties: false
          description: Complete strip settings for active tracks only. Omitted tracks play at 0 dB, centered and unmuted. At least one active track must be unmuted.
          properties:
            lead: { $ref: '#/components/schemas/LocalMixStrip' }
            bass: { $ref: '#/components/schemas/LocalMixStrip' }
            drums: { $ref: '#/components/schemas/LocalMixStrip' }
            chords: { $ref: '#/components/schemas/LocalMixStrip' }
    LocalPlan:
      type: object
      required: [id, noteRevision, sourceRevision, draftRevision, text, basisRecordingId, recipe, basisRecipe, summary, canGenerate, warnings, model]
      properties:
        id: { type: string }
        noteRevision: { type: integer }
        sourceRevision: { type: integer }
        draftRevision: { type: integer }
        text: { type: string }
        basisRecordingId: { type: string }
        recipe: { $ref: '#/components/schemas/LocalRecipe' }
        basisRecipe: { $ref: '#/components/schemas/LocalRecipe' }
        summary: { type: string }
        canGenerate: { type: boolean }
        warnings: { type: array, items: { type: string } }
        model: { type: object, additionalProperties: true }
    LocalState:
      type: object
      required: [available, unavailableReason, activeJob, latestJob, notes, plan]
      properties:
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'] }
        freeformAvailable: { type: boolean, description: Availability of the optional local language planner. Older servers report only available. }
        freeformUnavailableReason: { type: [string, 'null'] }
        activeJob: { anyOf: [{ $ref: '#/components/schemas/LocalJob' }, { type: 'null' }] }
        latestJob: { anyOf: [{ $ref: '#/components/schemas/LocalJob' }, { type: 'null' }] }
        notes: { anyOf: [{ $ref: '#/components/schemas/LocalNotes' }, { type: 'null' }] }
        plan: { anyOf: [{ $ref: '#/components/schemas/LocalPlan' }, { type: 'null' }] }
    LocalSourceCommand:
      type: object
      required: [expectedSourceRevision]
      properties:
        expectedSourceRevision: { type: integer, minimum: 1 }
    LocalRevisionCommand:
      type: object
      required: [expectedSourceRevision, expectedNoteRevision]
      properties:
        expectedSourceRevision: { type: integer, minimum: 1 }
        expectedNoteRevision: { type: integer, minimum: 1 }
    LocalNotesCommand:
      type: object
      required: [expectedSourceRevision, expectedNoteRevision, notes, confirm]
      properties:
        expectedSourceRevision: { type: integer, minimum: 1 }
        expectedNoteRevision: { type: integer, minimum: 1 }
        notes: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/LocalNote' } }
        confirm: { type: boolean }
    LocalPlanCommand:
      type: object
      required: [expectedSourceRevision, expectedNoteRevision, expectedDraftRevision, text, basisRecordingId]
      properties:
        expectedSourceRevision: { type: integer, minimum: 1 }
        expectedNoteRevision: { type: integer, minimum: 1 }
        expectedDraftRevision: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        basisRecordingId: { type: [string, 'null'] }

    LocalCorrectionCommand:
      type: object
      additionalProperties: false
      required: [expectedSourceRevision, expectedNoteRevision, expectedDraftRevision, text, basisRecordingId, recipe]
      properties:
        expectedSourceRevision: { type: integer, minimum: 1 }
        expectedNoteRevision: { type: integer, minimum: 1 }
        expectedDraftRevision: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        basisRecordingId: { type: [string, 'null'] }
        recipe: { $ref: '#/components/schemas/LocalRecipe' }
